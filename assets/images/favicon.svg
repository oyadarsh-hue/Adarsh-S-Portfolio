<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="argonGradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38efff"/>
      <stop offset="35%" stop-color="#a855f7"/>
      <stop offset="70%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="argonGradB" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#38efff"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="argonCore" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#19234d"/>
      <stop offset="70%" stop-color="#090d24"/>
      <stop offset="100%" stop-color="#040612"/>
    </radialGradient>
    <filter id="argonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Outer 3D Prismatic Octagon Shield -->
  <polygon points="60,4 100,20 116,60 100,100 60,116 20,100 4,60 20,20" fill="url(#argonCore)" stroke="url(#argonGradA)" stroke-width="4"/>
  <!-- Inner Rotated Cyber Hexagon -->
  <polygon points="60,14 99,36 99,84 60,106 21,84 21,36" fill="none" stroke="url(#argonGradB)" stroke-width="2.5" stroke-dasharray="10 4" opacity="0.9"/>
  <!-- 3D Orbital Gyro Rings -->
  <ellipse cx="60" cy="60" rx="46" ry="20" transform="rotate(-28 60 60)" stroke="#38efff" stroke-width="1.8" opacity="0.65"/>
  <ellipse cx="60" cy="60" rx="46" ry="20" transform="rotate(28 60 60)" stroke="#f472b6" stroke-width="1.8" opacity="0.65"/>
  <!-- 3D Extruded 'A' + 'S' Monogram -->
  <path d="M36 84 L54 32 L64 32 L82 84 L71 84 L67 71 L51 71 L47 84 Z M54 62 L64 62 L59 44 Z" fill="url(#argonGradA)" filter="url(#argonGlow)"/>
  <circle cx="88" cy="80" r="6" fill="#38efff"/>
  <circle cx="60" cy="14" r="3.5" fill="#fbbf24"/>
  <circle cx="60" cy="106" r="3.5" fill="#34d399"/>
</svg>