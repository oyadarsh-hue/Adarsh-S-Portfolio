name: Portfolio quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check all JavaScript syntax
        run: |
          for file in assets/js/*.js scripts/*.mjs; do
            node --check "$file"
          done
      - name: Check pages, assets, anchors and metadata
        run: node scripts/check-site.mjs
      - name: Check project discovery behavior
        run: node scripts/check-recruiter.mjs
      - name: Check new tools and experiment invariants
        run: node scripts/check-tools.mjs
      - name: Check scroll geometry
        run: node scripts/check-scroll-geometry.mjs
  browser:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test tooling
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Verify desktop, mobile and fallback behavior
        run: python scripts/browser-smoke.py
      - name: Verify interactive workbench and engineering lab
        run: python scripts/browser-tools.py
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-browser-evidence
          path: qa-artifacts/
          retention-days: 14
